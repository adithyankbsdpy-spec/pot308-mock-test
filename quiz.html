  options: [
    "Liquid-like",
    "Combination of solid and liquid",
    "Combination of gas and solid",
    "Solid only"
  ],
  answer: "Combination of solid and liquid"
}

const quizForm = document.getElementById("quizForm");

questions.forEach((q, index) => {
  const div = document.createElement("div");
  div.className = "question";

  let html = `<p>${index + 1}. ${q.question}</p>`;
q.options.forEach(option => {
  html += `
    <label style="display:block; margin:5px 0;">
      <input type="radio" 
             name="q${index}" 
             value="${option}"
             onchange="showAnswer(${index}, this.value, '${q.answer.replace(/'/g, "\\'")}')">
      ${option}
    </label>
  `;
});

html += `<div id="answer${index}" style="font-weight:bold; margin-top:5px;"></div>`;


  div.innerHTML = html;
  quizForm.appendChild(div);
});

function submitQuiz() {
  let score = 0;
  let reviewHTML = "";

  questions.forEach((q, index) => {
    const selected = document.querySelector(`input[name="q${index}"]:checked`);
    const userAnswer = selected ? selected.value : "Not Answered";

    if (userAnswer === q.answer) {
      score++;check 
    }

    reviewHTML += `
      <div class="question">
        <p>${index + 1}. ${q.question}</p>
        <p>Your Answer: <span class="${userAnswer === q.answer ? 'correct' : 'wrong'}">${userAnswer}</span></p>
        <p>Correct Answer: <span class="correct">${q.answer}</span></p>
      </div>
    `;
  });

  document.getElementById("result").innerHTML =
    `You scored ${score} out of ${questions.length} (${((score/questions.length)*100).toFixed(2)}%)`;

const studentName = localStorage.getItem("studentName");

database.ref("leaderboard").push({
    name: studentName,
    score: score
});
  document.getElementById("review").innerHTML = reviewHTML;
}


function showAnswer(index, selected, correctAnswer) {
  const answerBox = document.getElementById("answer" + index);

  if (selected === correctAnswer) {
    answerBox.innerHTML = "✔ Correct";
    answerBox.style.color = "green";
  } else {
    answerBox.innerHTML = "✘ Wrong | Correct Answer: " + correctAnswer;
    answerBox.style.color = "red";
  }
}
</script>
