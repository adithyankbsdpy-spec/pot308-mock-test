<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <title>POT308 Mock Test Portal</title>
    
    <style>
        body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 10px;
}

.container {
    width: 95%;
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-sizing: border-box;
}

.question {
    text-align: left;
    margin-bottom: 20px;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 10px;
}

label {
    display: block;
    margin: 8px 0;
    font-size: 18px;
}

button {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    background: black;
    color: white;
    border: none;
    border-radius: 10px;
}

@media (max-width: 600px) {
    h1 { font-size: 26px; }
    h2 { font-size: 20px; }
    label { font-size: 16px; }
}
    </style>
</head>
<body>

<div class="container">
    <h1>POT308 Mock Test Portal</h1>
    <h2>Enter Your Name</h2>

    <input type="text" id="studentName" placeholder="Your Name">
    <br><br>

    <button onclick="startTest()">Start Test</button>

    <h2>Global Leaderboard</h2>
    <div id="leaderboard">Loading...</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD-j2J5VypagWw6OKkBDym-CnIDfq-YyoM",
  authDomain: "mock-test-1afaa.firebaseapp.com",
  databaseURL: "https://mock-test-1afaa-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mock-test-1afaa",
  storageBucket: "mock-test-1afaa.firebasestorage.app",
  messagingSenderId: "319196350921",
  appId: "1:319196350921:web:7c7999646ca58553cdc018",
  measurementId: "G-W28W69FM2S"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

function startTest() {
    const name = document.getElementById("studentName").value.trim();

    if (!name) {
        alert("Please enter your name");
        return;
    }

    localStorage.setItem("studentName", name);

    window.location.href = "quiz.html";
}

function loadLeaderboard() {
    database.ref("leaderboard")
        .orderByChild("score")
        .limitToLast(10)
        .once("value", snapshot => {
            let scores = [];

            snapshot.forEach(child => {
                scores.push(child.val());
            });

            scores.reverse();

            let html = "<ol>";

            scores.forEach(entry => {
                html += `<li>${entry.name} - ${entry.score} marks</li>`;
            });

            html += "</ol>";

            document.getElementById("leaderboard").innerHTML = html;
        });
}

loadLeaderboard();
</script>

</body>
</html>
